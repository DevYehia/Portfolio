<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My first three.js app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style/overlay.css">
    <link rel="stylesheet" href="Style/pauseMenu.css">
  </head>
  <body>

    <!-- PopUp when user collects certificate -->
    <div id = "certCollectedPopUp" hidden = "true">
        <img id = "certImage">
        <p id = "popUpTitle">Certificate Collected!</p>
        <p>Press P to view in Pause Menu</p>
    </div>

    <!-- Interaction Hint -->
    <div id="ui">
        <div id="interactHint">[E] Open Door</div>
    </div>

    <!-- Dialog Container -->
    <div id = "talkDivContainer" class = "bottomDivContainer"  hidden="true">
        <div id = "talkControls" class = "bottomDivTitle">
            Q - Next Line<br>
            X - Skip All
        </div>
        <div id="talkDiv" class="bottomDiv"></div>
    </div>
    <div id="clickDiv">Click to Start</div>

    <!-- Options Container -->
    <div id = "optionsContainer" class="bottomDivContainer" hidden = "true">
        <div class = "bottomDivTitle">
            ENTER - Select
        </div>
        <div class="bottomDiv" style = "display: flex; flex-direction: column;">
            <div id="optionsTitle" class = "optionsTitle centered"></div>
            <div id="optionsGrid"></div>
        </div>
    </div>


    <!-- Side Menu -->
    <div id="gameMenu" class="closed">
      <div class="menu-item" id="continueBtn">Continue</div>
      <div class="menu-item" id="collectiblesBtn">Collectibles</div>
      <div class="menu-item" id="restartBtn">Restart</div>
    </div>

   <div id="collectiblesContainer" class="closed">
        <div id = "collectiblesScroller"></div>
        <div id = "collectiblesDetail" hidden = true>
            <p id = "totalColl"></p>
            <img id = "selCollImg"> <!-- The image of the selected certificate-->
            <p id = "selCollName"></p>
            <p id = "selCollDesc"></p>            
        </div>
        <div id = "Back" class = "menuButton">Back</div>
   </div>
    <script type="module" src="/run.js"></script>
  </body>
</html>
